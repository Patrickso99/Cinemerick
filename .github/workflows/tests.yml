name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Runs the shared tests on the desktop JVM and on the Android host JVM. The iOS simulator tests are not run here.
      - name: Run tests
        shell: bash
        run: ./gradlew desktopTest testAndroidHostTest --continue --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/test-results/**/*.xml
          if-no-files-found: warn
