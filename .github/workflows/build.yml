name: Build artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android APK + Linux DEB
            os: ubuntu-latest
            lanes: "android apk_release|desktop_deb"
          - name: Windows EXE + MSI
            os: windows-latest
            lanes: "desktop_exe|desktop_msi"
          - name: macOS DMG
            os: macos-latest
            lanes: "desktop_dmg"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        if: runner.os == 'Linux'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build with Fastlane
        shell: bash
        run: |
          IFS='|' read -ra LANES <<< "${{ matrix.lanes }}"
          for lane in "${LANES[@]}"; do
            bundle exec fastlane $lane
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: dist/*
          if-no-files-found: error
